<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Διαχείριση πελατών και websites στο Saitari.">
<title>Πελάτες — Saitari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--ink:#0b1020;--indigo:#635bff;--canvas:#f7f8fc;--surface:#fff;--border:#e3e8f2;--text:#151c32;--muted:#75809a;--shadow:0 16px 42px rgba(22,31,65,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:30px 14px 20px;display:flex;flex-direction:column;background:var(--ink);color:#c9d2eb}.brand{display:flex;align-items:center;gap:11px;margin:0 14px 42px;color:#fff;font:700 1.55rem "Space Grotesk";letter-spacing:-.06em}.brand-mark{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(140deg,#635bff,#887fff);color:#fff;font-size:.8rem}.nav-label{margin:0 14px 9px;color:#7280a4;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.nav-group{margin-bottom:29px}.nav-item{min-height:45px;display:flex;align-items:center;gap:12px;border-left:3px solid transparent;border-radius:9px;padding:0 14px;color:#bdc8e6;text-decoration:none;font-size:.89rem;font-weight:500;transition:.2s}.nav-item svg{width:18px;height:18px;stroke-width:1.8}.nav-item:hover{color:#fff;background:#ffffff0f}.nav-item.active{color:#fff;border-left-color:var(--indigo)}.sidebar-footer{margin-top:auto;padding:18px 12px 0;border-top:1px solid #ffffff17}.profile{display:flex;align-items:center;gap:10px}.avatar{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#7069ff,#3731a9);color:#fff;font-size:.69rem;font-weight:700}.profile strong,.profile small{display:block}.profile strong{color:white;font-size:.83rem}.profile small{margin-top:2px;color:#8090b5;font-size:.72rem}
.content{min-width:0}.topbar{height:95px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 46px;border-bottom:1px solid var(--border);background:#ffffffba}.search{width:min(390px,40vw);display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:#f2f5fb;color:var(--muted)}.search svg{width:18px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:.88rem}.top-actions{display:flex;align-items:center;gap:22px}.icon-button{width:37px;height:37px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#3c4966}.icon-button svg{width:20px}.account{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600}.account svg{width:16px;color:var(--muted)}
main{width:min(100%,1320px);margin:0 auto;padding:56px 46px 70px}h1,h2{margin:0;font-family:"Space Grotesk",sans-serif;letter-spacing:-.05em}h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1}.intro{margin:12px 0 0;color:var(--muted);font-size:.96rem}.page-header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.primary-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:9px;background:var(--indigo);color:white;font-size:.87rem;font-weight:650;cursor:pointer}.primary-button svg{width:17px}.primary-button:hover{box-shadow:0 10px 22px #635bff33;transform:translateY(-1px)}
.project-search{width:100%;max-width:460px;height:46px;margin:0 0 18px;padding:0 15px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font:inherit;outline:0}.project-search:focus,.field input:focus,.field textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px #635bff1c}.project-count{margin:0 0 15px;color:var(--muted);font-size:.82rem}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.project-card{min-width:0;padding:16px;border:1px solid var(--border);border-radius:15px;background:#fff;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}.project-card:hover{transform:translateY(-2px);border-color:#c9c6ff}.project-logo{height:180px;display:grid;place-items:center;overflow:hidden;border-radius:10px;background:#f1f3f8;color:#97a1b5}.project-logo img{width:100%;height:100%;object-fit:contain;background:white}.logo-placeholder{font-size:.8rem}.project-info{padding:17px 3px 2px}.project-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.project-card h2{font-size:1.28rem;line-height:1.2}.project-url{display:block;margin-top:5px;color:var(--muted);font-size:.82rem;text-decoration:none;overflow-wrap:anywhere}.project-description{margin:11px 0 15px;color:#596780;font-size:.86rem;line-height:1.5}.project-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:13px;border-top:1px solid var(--border)}.request-count{color:#596780;font-size:.82rem}.project-actions{display:flex;align-items:center;gap:15px}.delete-project{border:0;padding:8px 4px;background:transparent;color:#8d5360;font-size:.77rem;font-weight:600;cursor:pointer}.open-project{width:46px;height:42px;display:grid;place-items:center;padding:0 19px 0 10px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);font-size:1.2rem;text-decoration:none;transition:.2s}.open-project:hover{border-color:#c9c6ff;color:var(--indigo);background:#fafaff}.empty-state{padding:45px 20px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);text-align:center}.empty-state[hidden]{display:none}
.modal-backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:#0b102080;backdrop-filter:blur(4px)}.modal-backdrop.open{display:flex}.modal{width:min(100%,590px);max-height:calc(100vh - 48px);overflow:auto;padding:28px;border-radius:17px;background:white;box-shadow:0 24px 80px #0710223d}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.modal-head h2{font-size:1.5rem}.close-modal{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border);border-radius:9px;background:white;color:#53617a;cursor:pointer}.close-modal svg{width:18px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:17px}.field label{color:#35415a;font-size:.82rem;font-weight:650}.field input,.field textarea{width:100%;min-height:45px;border:1px solid var(--border);border-radius:9px;padding:11px 13px;outline:0;color:var(--text);background:#fff;font-size:.88rem}.field textarea{min-height:92px;resize:vertical}.upload-zone{min-height:92px;display:flex;align-items:center;justify-content:center;border:1px dashed #cbd3e3;border-radius:10px;background:#fafbfe;color:#57647e;text-align:center;cursor:pointer}.logo-preview{position:relative;display:none;width:104px;height:80px;margin-top:10px;border:1px solid var(--border);border-radius:9px;background:#f4f6fa}.logo-preview.show{display:block}.logo-preview img{width:100%;height:100%;object-fit:contain}.remove-logo{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:7px;background:#111827d9;color:#fff;cursor:pointer}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.secondary-button{min-height:43px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:#fff;color:#3f4b65;font-size:.86rem;font-weight:650;cursor:pointer}
.mobile-nav{display:none}@media(max-width:1100px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:1020px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding-inline:10px}.brand{justify-content:center;margin-inline:0}.brand>span:last-child,.nav-label,.nav-item>span{display:none}.nav-item{justify-content:center;padding:0}.nav-item svg{width:20px;height:20px}.profile{justify-content:center}.profile div{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.mobile-nav{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;background:#0b1020;border:1px solid #ffffff18;border-radius:16px;box-shadow:0 12px 35px #0b102044}.mobile-nav a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#bdc8e6;text-decoration:none;font-size:.68rem}.mobile-nav a.active{color:#fff;border-bottom:2px solid var(--indigo)}.mobile-nav svg{width:19px;height:19px}body{padding-bottom:94px}.topbar{height:72px;padding:0 20px}.search{display:none}main{padding:38px 20px 50px}.page-header{align-items:flex-start;flex-direction:column;margin-bottom:25px}.project-grid{grid-template-columns:1fr}.project-logo{height:155px}.page-header .primary-button{align-self:flex-start}}
@media(max-width:480px){.account{display:none}.modal{padding:21px}.project-logo{height:145px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><span class="brand-mark">S</span><span>Saitari</span></div>
<div class="nav-group"><p class="nav-label">Workspace</p>
<a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
<a class="nav-item" href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a>
<a class="nav-item active" href="websites.html" aria-current="page"><i data-lucide="monitor"></i><span>Πελάτες</span></a>
<a class="nav-item" href="archive.html"><i data-lucide="archive"></i><span>Αρχεία</span></a>
</div>
<div class="sidebar-footer"><div class="profile"><span class="avatar">NT</span><div><strong>Tasos</strong><small>Designer</small></div></div></div>
</aside>
<nav class="mobile-nav" aria-label="Κύρια πλοήγηση"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a><a href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a><a class="active" href="websites.html" aria-current="page"><i data-lucide="monitor"></i><span>Πελάτες</span></a><a href="archive.html"><i data-lucide="archive"></i><span>Αρχεία</span></a></nav>
<div class="content">
<header class="topbar"><label class="search"><i data-lucide="search"></i><input id="topSearch" type="search" placeholder="Αναζήτηση πελατών..." aria-label="Αναζήτηση πελατών"></label><div class="top-actions"><button class="icon-button" aria-label="Ειδοποιήσεις"><i data-lucide="bell"></i></button><div class="account">Tasos <i data-lucide="chevron-down"></i></div></div></header>
<main>
<section class="page-header"><div><h1>Πελάτες</h1><p class="intro">Τα websites και τα αιτήματα κάθε πελάτη σε ένα σημείο.</p></div><button class="primary-button" id="addProject"><i data-lucide="plus"></i>Νέος πελάτης</button></section>
<input class="project-search" id="projectSearch" type="search" placeholder="Αναζήτηση πελάτη ή website..." aria-label="Αναζήτηση πελάτη ή website">
<p class="project-count" id="projectCount"></p>
<section class="project-grid" id="projectGrid" aria-live="polite"></section>
<div class="empty-state" id="emptyState" hidden>Δεν βρέθηκαν πελάτες για αυτή την αναζήτηση.</div>
</main>
</div></div>
<div class="modal-backdrop" id="projectModal" role="presentation">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
<div class="modal-head"><h2 id="projectModalTitle">Νέος πελάτης</h2><button class="close-modal" id="closeProjectModal" type="button" aria-label="Κλείσιμο"><i data-lucide="x"></i></button></div>
<form id="projectForm">
<div class="field"><label for="projectName">Όνομα website / project</label><input id="projectName" required maxlength="70" placeholder="π.χ. Saitari"></div>
<div class="field"><label for="projectClient">Πελάτης</label><input id="projectClient" maxlength="70" placeholder="Όνομα πελάτη ή ομάδας"></div>
<div class="field"><label for="projectUrl">Website URL</label><input id="projectUrl" type="url" placeholder="https://example.gr"></div>
<div class="field"><label for="projectDescription">Σύντομη περιγραφή</label><textarea id="projectDescription" maxlength="180" placeholder="Τι αφορά το website;"></textarea></div>
<div class="field"><label for="projectLogo">Logo ή φωτογραφία website</label><label class="upload-zone" for="projectLogo">Πρόσθεσε εικόνα · PNG, JPG ή WEBP</label><input id="projectLogo" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="logo-preview" id="logoPreview"><img id="logoPreviewImage" alt="Προεπισκόπηση logo"><button class="remove-logo" type="button" id="removeLogo" aria-label="Αφαίρεση logo">×</button></div></div>
<div class="form-actions"><button class="secondary-button" type="button" id="cancelProject">Ακύρωση</button><button class="primary-button" type="submit">Δημιουργία πελάτη</button></div>
</form>
</section></div>
<script>
lucide.createIcons();
const PROJECTS_KEY="saitari-projects", DELETED_KEY="saitari-deleted-projects", REQUESTS_KEY="saitari-requests", ARCHIVE_KEY="saitari-archived-requests";
const BUILT_INS=["Saitari","Kritivela","Calendrai","Portfolio","Run Jane Run","Football Quiz","Fun Quiz"];
const projects=[
{name:"Saitari",client:"Tasos · Product demo",url:"",description:"Διαχείριση αιτημάτων αλλαγών website."},
{name:"Kritivela",client:"Elena P. · Hospitality",url:"",description:"Ιστότοπος φιλοξενίας και κρατήσεων."},
{name:"Calendrai",client:"Marios K. · Services",url:"",description:"Ραντεβού και online ημερολόγιο."},
{name:"Portfolio",client:"Nadia S. · Creative",url:"",description:"Παρουσίαση δουλειάς και projects."},
{name:"Run Jane Run",client:"Alex D. · Fitness",url:"",description:"Πρόγραμμα προπονήσεων και κοινότητα."},
{name:"Football Quiz",client:"Leo P. · Games",url:"",description:"Διαδραστικό quiz για ποδόσφαιρο."},
{name:"Fun Quiz",client:"Mina R. · Games",url:"",description:"Σύντομα quiz για φίλους και παρέες."}
];
let deletedNames=[];try{deletedNames=JSON.parse(localStorage.getItem(DELETED_KEY)||"[]")}catch(e){}
for(let i=projects.length-1;i>=0;i--)if(deletedNames.includes(projects[i].name))projects.splice(i,1);
try{const stored=JSON.parse(localStorage.getItem(PROJECTS_KEY)||"[]");stored.forEach(item=>{if(!projects.some(p=>p.name.toLowerCase()===String(item.name).toLowerCase())&&!deletedNames.includes(item.name))projects.push(item)})}catch(e){}
let selectedLogo="";
const grid=document.getElementById("projectGrid"), search=document.getElementById("projectSearch"),topSearch=document.getElementById("topSearch"),empty=document.getElementById("emptyState"),count=document.getElementById("projectCount"),modal=document.getElementById("projectModal"),form=document.getElementById("projectForm");
function readRows(key){const body=document.createElement("tbody");try{body.innerHTML=localStorage.getItem(key)||""}catch(e){}return [...body.rows]}
function saveCustomProjects(){const custom=projects.filter(p=>!BUILT_INS.includes(p.name));localStorage.setItem(PROJECTS_KEY,JSON.stringify(custom));localStorage.setItem(DELETED_KEY,JSON.stringify(deletedNames))}
function renderProjects(){grid.innerHTML="";const requestRows=readRows(REQUESTS_KEY);projects.forEach(project=>{
 const siteRequests=requestRows.filter(row=>(["Run","Jane","Run!"].includes(row.dataset.website)?"Run Jane Run":row.dataset.website)===project.name).length;
 const card=document.createElement("article");card.className="project-card";card.dataset.search=(project.name+" "+(project.client||"")+" "+(project.url||"")+" "+(project.description||"")).toLowerCase();
 card.innerHTML='<div class="project-logo"><span class="logo-placeholder">Logo / φωτογραφία website</span></div><div class="project-info"><div class="project-heading"><div><h2></h2><a class="project-url" target="_blank" rel="noopener noreferrer"></a></div></div><p class="project-description"></p><div class="project-bottom"><span class="request-count"></span><div class="project-actions"><button class="delete-project" type="button">Διαγραφή</button><a class="open-project" href="#" aria-label="Προβολή αιτημάτων">→</a></div></div></div>';
 const imageBox=card.querySelector(".project-logo");if(project.logo){const img=document.createElement("img");img.src=project.logo;img.alt="Logo του "+project.name;imageBox.replaceChildren(img)}
 card.querySelector("h2").textContent=project.name;
 const link=card.querySelector(".project-url");if(project.url){link.href=/^https?:\/\//i.test(project.url)?project.url:"https://"+project.url;link.textContent=project.url}else{link.remove()}
 card.querySelector(".project-description").textContent=[project.client,project.description].filter(Boolean).join(" · ")||"Website / project";
 card.querySelector(".request-count").textContent=siteRequests+" "+(siteRequests===1?"αίτημα":"αιτήματα");
 card.querySelector(".open-project").href="requests.html?website="+encodeURIComponent(project.name);
 card.querySelector(".delete-project").addEventListener("click",()=>deleteProject(project));
 grid.appendChild(card);
});lucide.createIcons();filterProjects()}
function filterProjects(){if(!search)return;const term=search.value.trim().toLowerCase();let visible=0;[...grid.children].forEach(card=>{const show=card.dataset.search.includes(term);card.hidden=!show;if(show)visible++});count.textContent=visible+" "+(visible===1?"πελάτης":"πελάτες");empty.hidden=visible!==0}
function deleteProject(project){const aliases=project.name==="Run Jane Run"?["Run Jane Run","Run","Jane","Run!"]:[project.name];const active=document.createElement("tbody"),archive=document.createElement("tbody");active.innerHTML=localStorage.getItem(REQUESTS_KEY)||"";archive.innerHTML=localStorage.getItem(ARCHIVE_KEY)||"";const linked=[...active.rows,...archive.rows].filter(row=>aliases.includes(row.dataset.website));const extra=linked.length?" Θα διαγραφούν και τα "+linked.length+" σχετικά αιτήματα.":"";if(!confirm("Να διαγραφεί ο πελάτης «"+project.name+"»;"+extra))return;linked.forEach(row=>row.remove());try{localStorage.setItem(REQUESTS_KEY,active.innerHTML);localStorage.setItem(ARCHIVE_KEY,archive.innerHTML);const idx=projects.indexOf(project);if(idx>=0)projects.splice(idx,1);if(BUILT_INS.includes(project.name))deletedNames.push(project.name);saveCustomProjects();renderProjects()}catch(e){alert("Δεν ήταν δυνατή η αποθήκευση της διαγραφής.")}}
function openModal(){modal.classList.add("open");document.getElementById("projectName").focus()}function closeModal(){modal.classList.remove("open");form.reset();selectedLogo="";document.getElementById("logoPreview").classList.remove("show");document.getElementById("logoPreviewImage").removeAttribute("src")}
async function imageToDataUrl(file){if(file.size>8*1024*1024)throw new Error("Η εικόνα πρέπει να είναι μικρότερη από 8 MB.");return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("Δεν ήταν δυνατή η ανάγνωση της εικόνας."));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("Δεν ήταν δυνατή η φόρτωση της εικόνας."));img.onload=()=>{const scale=Math.min(1,900/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL("image/webp",.78);if(data.length>500000)data=canvas.toDataURL("image/jpeg",.68);if(data.length>700000)return reject(new Error("Η εικόνα logo είναι ακόμη μεγάλη. Δοκίμασε μικρότερη εικόνα."));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
document.getElementById("addProject").addEventListener("click",openModal);document.getElementById("closeProjectModal").addEventListener("click",closeModal);document.getElementById("cancelProject").addEventListener("click",closeModal);modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("projectLogo").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{selectedLogo=await imageToDataUrl(file);document.getElementById("logoPreviewImage").src=selectedLogo;document.getElementById("logoPreview").classList.add("show")}catch(error){selectedLogo="";e.target.value="";alert(error.message)}});
document.getElementById("removeLogo").addEventListener("click",()=>{selectedLogo="";document.getElementById("projectLogo").value="";document.getElementById("logoPreview").classList.remove("show")});
form.addEventListener("submit",e=>{e.preventDefault();const name=document.getElementById("projectName").value.trim();if(projects.some(p=>p.name.toLowerCase()===name.toLowerCase())){alert("Υπάρχει ήδη πελάτης με αυτό το όνομα.");return}const project={name,client:document.getElementById("projectClient").value.trim(),url:document.getElementById("projectUrl").value.trim(),description:document.getElementById("projectDescription").value.trim(),logo:selectedLogo,type:"Website"};projects.unshift(project);deletedNames=deletedNames.filter(n=>n.toLowerCase()!==name.toLowerCase());try{saveCustomProjects();closeModal();renderProjects()}catch(error){projects.shift();alert("Δεν υπάρχει αρκετός χώρος στον browser για να αποθηκεύσεις αυτό το logo. Δοκίμασε μικρότερη εικόνα.")}});
search.addEventListener("input",()=>{topSearch.value=search.value;filterProjects()});topSearch.addEventListener("input",()=>{search.value=topSearch.value;filterProjects()});renderProjects();
</script>
</body>
</html>
