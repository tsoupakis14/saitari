    .app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:30px 14px 20px;display:flex;flex-direction:column;background:var(--ink);color:#c9d2eb}.brand{display:flex;align-items:center;gap:11px;margin:0 14px 42px;color:#fff;font:700 1.55rem "Space Grotesk";letter-spacing:-.06em}.brand-mark{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(140deg,#635bff,#887fff);color:#fff;font-size:.8rem}.nav-label{margin:0 14px 9px;color:#7280a4;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.nav-group{margin-bottom:29px}.nav-item{min-height:45px;display:flex;align-items:center;gap:12px;border-left:3px solid transparent;border-radius:9px;padding:0 14px;color:#bdc8e6;text-decoration:none;font-size:.89rem;font-weight:500}.nav-item svg{width:18px;height:18px}.nav-item:hover{color:white;background:#ffffff0f}.nav-item.active{color:white;border-left-color:var(--indigo)}.sidebar-footer{margin-top:auto;padding:18px 12px 0;border-top:1px solid #ffffff17}.profile{display:flex;align-items:center;gap:10px}.avatar{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#7069ff,#3731a9);color:white;font-size:.69rem;font-weight:700}.profile strong,.profile small{display:block}.profile strong{color:white;font-size:.83rem}.profile small{margin-top:2px;color:#8090b5;font-size:.72rem}
    .content{min-width:0}.topbar{height:95px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 46px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72)}.search{width:min(400px,44vw);height:42px;display:flex;align-items:center;gap:11px;padding:0 13px;border:1px solid #dce3ef;border-radius:9px;background:#fff;color:var(--muted)}.search:focus-within{border-color:#a9a5ff;box-shadow:0 0 0 3px #635bff12}.search svg{width:17px;height:17px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:.88rem}.top-actions{display:flex;align-items:center;gap:22px}.icon-button{width:37px;height:37px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#3c4966}.icon-button:hover{background:#f1f4fa}.icon-button svg{width:20px;height:20px}.account{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600}.account svg{width:16px;color:var(--muted)}
    main{width:min(100%,1320px);margin:0 auto;padding:56px 46px 70px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:36px}h1,h2{margin:0;font-family:"Space Grotesk",sans-serif;letter-spacing:-.045em}h1{font-size:clamp(2rem,3vw,2.55rem);font-weight:700;line-height:1.1}.primary-button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 17px;border:0;border-radius:8px;background:var(--indigo);color:white;font-size:.86rem;font-weight:650;cursor:pointer}.primary-button:hover{background:#5148ed}.primary-button svg{width:17px}
    .toolbar{display:grid;grid-template-columns:198px 198px 1fr;align-items:center;gap:13px;margin-bottom:23px}.select-wrap{position:relative}.select-wrap select{width:100%;height:40px;appearance:none;-webkit-appearance:none;padding:0 42px 0 13px;border:1px solid #dce3ef;border-radius:8px;background-color:white;color:#28354e;font-size:.82rem;cursor:pointer;outline:0}.select-wrap select:focus{border-color:#a9a5ff;box-shadow:0 0 0 3px #635bff12}.select-wrap:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:1.7px solid #26344d;border-bottom:1.7px solid #26344d;transform:translateY(-70%) rotate(45deg);pointer-events:none}.customer-count{justify-self:end;color:var(--muted);font-size:.81rem}
    .project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.project-card{min-width:0;min-height:172px;display:grid;grid-template-columns:104px minmax(0,1fr);gap:17px;padding:18px;border:1px solid #dfe5ef;border-radius:10px;background:white;box-shadow:var(--shadow);transition:border-color .18s,transform .18s}.project-card:hover{border-color:#c9c6ff;transform:translateY(-1px)}.project-logo{width:104px;height:104px;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:#eef1f6;color:#8995aa;font-size:.68rem;text-align:center}.project-logo img{width:100%;height:100%;object-fit:contain;background:#f7f8fa}.project-body{min-width:0;display:flex;flex-direction:column}.project-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.project-name{font-size:1.12rem;line-height:1.2;overflow-wrap:anywhere}.project-client{margin:4px 0 0;color:#60708c;font-size:.8rem;overflow-wrap:anywhere}.project-description{display:none}.project-status{display:flex;align-items:center;gap:10px;margin-top:14px;color:#31405a;font-size:.77rem}.project-status:before{content:"";width:3px;height:22px;border-radius:2px;background:var(--green)}.project-card[data-status="Ανενεργός"] .project-status:before{background:#929db0}.project-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:9px;border-top:1px solid #e6eaf1}.request-count{color:#536581;font-size:.76rem}.edit-project{width:31px;height:31px;display:grid;place-items:center;flex:0 0 auto;padding:0;border:1px solid #dce3ef;border-radius:7px;background:white;color:#53617a;cursor:pointer}.edit-project:hover{border-color:#bdb9ff;color:var(--indigo);background:#fafaff}.edit-project svg{width:15px;height:15px}.open-project{width:40px;height:38px;display:grid;place-items:center;padding:0;line-height:1;border:1px solid #dce3ef;border-radius:8px;background:white;color:#1e2a40;font-size:1.15rem;text-decoration:none}.open-project:hover{border-color:#bdb9ff;color:var(--indigo)}.empty{padding:48px 20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}.empty[hidden]{display:none}
    .modal-backdrop{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:#0b102080;backdrop-filter:blur(3px)}.modal-backdrop.open{display:flex}.modal{width:min(100%,540px);max-height:calc(100vh - 40px);overflow:auto;padding:26px;border-radius:14px;background:white;box-shadow:0 24px 80px #0710223d}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal-head h2{font-size:1.4rem}.close-modal{width:35px;height:35px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:white;color:#53617a;cursor:pointer}.close-modal svg{width:17px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{color:#35415a;font-size:.8rem;font-weight:650}.field input,.field textarea{width:100%;min-height:43px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:0;color:var(--text);background:#fff;font-size:.86rem}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px #635bff16}.upload-zone{min-height:62px;display:flex;align-items:center;justify-content:center;border:1px dashed #cbd3e3;border-radius:8px;background:#fafbfe;color:#57647e;font-size:.82rem;text-align:center;cursor:pointer}.logo-preview{position:relative;display:none;width:76px;height:65px;margin-top:8px;border:1px solid var(--line);border-radius:7px;background:#f4f6fa}.logo-preview.show{display:block}.logo-preview img{width:100%;height:100%;object-fit:contain}.remove-logo{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:6px;background:#111827d9;color:white;cursor:pointer}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.text-action{padding:0;border:0;background:transparent;color:var(--muted);font-size:.8rem;font-weight:650;cursor:pointer}.text-action.delete{color:#b42318}.text-action.delete:hover{text-decoration:underline}.secondary-button{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:white;color:#3f4b65;font-size:.83rem;font-weight:650;cursor:pointer}.save-error{margin:10px 0 0;color:#a23232;font-size:.8rem}.mobile-nav{display:none}
    @media(max-width:1200px){.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:repeat(2,minmax(0,198px)) 1fr}}
    @media(max-width:1020px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding-inline:10px}.brand{justify-content:center;margin-inline:0}.brand>span:last-child,.nav-label,.nav-item>span{display:none}.nav-item{justify-content:center;padding:0}.nav-item svg{width:20px;height:20px}.profile{justify-content:center}.profile div{display:none}.sidebar-footer{padding-inline:0}}
    @media(max-width:760px){.app{display:block}.sidebar{display:none}.mobile-nav{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;background:#0b1020;border:1px solid #ffffff18;border-radius:15px;box-shadow:0 12px 35px #0b102044}.mobile-nav a{min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#bdc8e6;text-decoration:none;font-size:.62rem}.mobile-nav a.active{color:white;border-bottom:2px solid var(--indigo)}.mobile-nav svg{width:18px;height:18px}body{padding-bottom:88px}.topbar{height:72px;padding:0 20px}.search{display:none}.top-actions{gap:10px}.account{font-size:.78rem}main{padding:32px 17px 42px}.page-heading{align-items:flex-start;flex-direction:column;margin-bottom:24px}.toolbar{grid-template-columns:1fr 1fr;gap:9px}.customer-count{grid-column:1/-1;justify-self:start}.project-grid{grid-template-columns:1fr;gap:12px}.project-card{min-height:152px;grid-template-columns:92px minmax(0,1fr);gap:13px;padding:14px}.project-logo{width:92px;height:92px}.project-status{margin-top:10px}.project-description{display:none}}
    @media(max-width:480px){.search{width:100%;max-width:calc(100vw - 145px)}.top-actions .icon-button{display:none}.account{display:none}.toolbar{grid-template-columns:1fr}.customer-count{grid-column:auto}.modal{padding:20px}.project-card{grid-template-columns:78px minmax(0,1fr);gap:11px;padding:12px}.project-logo{width:78px;height:78px}.project-name{font-size:1rem}.project-status{margin-top:8px}.text-action{font-size:.68rem}}
  </style>

</aside>
<nav class="mobile-nav" aria-label="Κύρια πλοήγηση"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a><a class="active" href="websites.html" aria-current="page"><i data-lucide="users-round"></i><span>Πελάτες</span></a><a href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a><a href="archive.html"><i data-lucide="archive"></i><span>Αρχείο</span></a></nav>
<div class="content">
  <header class="topbar"><label class="search"><i data-lucide="search"></i><input id="topSearch" type="search" placeholder="Αναζήτηση πελατών..." aria-label="Αναζήτηση πελατών"></label><div class="top-actions"><button class="icon-button" aria-label="Ειδοποιήσεις"><i data-lucide="bell"></i></button><div class="account">Tasos <i data-lucide="chevron-down"></i></div></div></header>
  <main>
    <section class="page-heading"><h1>Πελάτες</h1><button class="primary-button" id="addProject"><i data-lucide="plus"></i>Νέος πελάτης</button></section>
    <section class="toolbar" aria-label="Φίλτρα πελατών">
      <label class="select-wrap"><select id="statusFilter" aria-label="Φίλτρο κατάστασης"><option value="">Όλες οι καταστάσεις</option><option>Ενεργός</option><option>Ανενεργός</option></select></label>
      <label class="select-wrap"><select id="sortFilter" aria-label="Ταξινόμηση"><option value="recent">Ταξινόμηση: Πρόσφατοι</option><option value="name">Ταξινόμηση: Όνομα</option></select></label>
      <span class="customer-count" id="projectCount"></span>
    </section>
    <section class="project-grid" id="projectGrid" aria-live="polite"></section>
    <div class="empty" id="emptyState" hidden>Δεν βρέθηκαν πελάτες με αυτά τα φίλτρα.</div>
  </main>
</div>

  </div>
  <div class="modal-backdrop" id="projectModal" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <div class="modal-head"><h2 id="projectModalTitle">Νέος πελάτης</h2><button class="close-modal" id="closeProjectModal" type="button" aria-label="Κλείσιμο"><i data-lucide="x"></i></button></div>
      <form id="projectForm">
        <div class="field"><label for="projectName">Όνομα πελάτη / project</label><input id="projectName" required maxlength="70" placeholder="π.χ. Saitari"></div>
        <div class="field"><label for="projectContact">Υπεύθυνος ή ομάδα <span style="font-weight:400;color:#8390a6">(προαιρετικό)</span></label><input id="projectContact" maxlength="70" placeholder="Όνομα πελάτη ή ομάδας"></div>
        <div class="field"><label for="projectDescription">Σύντομη περιγραφή <span style="font-weight:400;color:#8390a6">(προαιρετικό)</span></label><textarea id="projectDescription" maxlength="180" placeholder="Τι αφορά το project"></textarea></div>
        <div class="field"><label for="projectStatus">Κατάσταση</label><select id="projectStatus" style="height:43px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:white;color:var(--text)"><option>Ενεργός</option><option>Ανενεργός</option></select></div>
        <div class="field"><label for="projectLogo">Logo ή φωτογραφία <span style="font-weight:400;color:#8390a6">(προαιρετικό)</span></label><label class="upload-zone" for="projectLogo">Πρόσθεσε εικόνα · PNG, JPG ή WEBP</label><input id="projectLogo" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="logo-preview" id="logoPreview"><img id="logoPreviewImage" alt="Προεπισκόπηση logo"><button class="remove-logo" type="button" id="removeLogo" aria-label="Αφαίρεση logo">×</button></div></div>
        <p class="save-error" id="saveError" hidden></p>
        <div class="form-actions" style="justify-content:space-between"><button class="text-action delete" type="button" id="deleteProjectInModal" hidden>Διαγραφή</button><div style="display:flex;gap:9px"><button class="secondary-button" type="button" id="cancelProject">Ακύρωση</button><button class="primary-button" type="submit" id="saveProject">Δημιουργία πελάτη</button></div></div>
      </form>
    </section>
  </div>
  <script>
    if (window.lucide) lucide.createIcons();
    const PROJECTS_KEY="saitari-projects", DELETED_KEY="saitari-deleted-projects", REQUESTS_KEY="saitari-requests", ARCHIVE_KEY="saitari-archived-requests", HISTORY_KEY="saitari-archive-history";
    const DEFAULT_PROJECTS=[
      {name:"Saitari",client:"Tasos",description:"Διαχείριση αιτημάτων αλλαγών website.",status:"Ενεργός"},
      {name:"Kritivela",client:"Elena P.",description:"Ιστότοπος φιλοξενίας και κρατήσεων.",status:"Ενεργός"},
      {name:"Calendrai",client:"Marios K.",description:"Ραντεβού και online ημερολόγιο.",status:"Ενεργός"},
      {name:"Portfolio",client:"Nadia S.",description:"Παρουσίαση δουλειάς και projects.",status:"Ενεργός"},
      {name:"Run Jane Run",client:"Alex D.",description:"Πρόγραμμα προπονήσεων και κοινότητα.",status:"Ενεργός"},
      {name:"Football Quiz",client:"Leo P.",description:"Διαδραστικό quiz για ποδόσφαιρο.",status:"Ανενεργός"},
      {name:"Fun Quiz",client:"Mina R.",description:"Σύντομα quiz για φίλους και παρέες.",status:"Ενεργός"}
    ];
    let deletedNames=[];try{deletedNames=JSON.parse(localStorage.getItem(DELETED_KEY)||"[]")}catch(e){}
    let projects=DEFAULT_PROJECTS.map(item=>({...item,id:slug(item.name),url:"",type:"Website",updatedAt:0}));
    try{const saved=JSON.parse(localStorage.getItem(PROJECTS_KEY)||"[]");saved.forEach(item=>{if(!item||!item.name)return;const at=projects.findIndex(p=>p.name.toLowerCase()===String(item.name).toLowerCase());const normalized={...item,id:item.id||slug(item.name),client:item.client??item.contact??"",status:(item.status==="Ανενεργός"||item.status==="Σε αναμονή"?"Ανενεργός":"Ενεργός"),updatedAt:Number(item.updatedAt)||0};if(at>=0)projects[at]={...projects[at],...normalized};else if(!deletedNames.includes(item.name))projects.push(normalized)})}catch(e){console.warn("Δεν διαβάστηκαν τα αποθηκευμένα projects.",e)}
    projects=projects.filter(p=>!deletedNames.includes(p.name));
    let editingId=null,selectedLogo="";
    const grid=document.getElementById("projectGrid"),search=document.getElementById("topSearch"),empty=document.getElementById("emptyState"),count=document.getElementById("projectCount"),modal=document.getElementById("projectModal"),form=document.getElementById("projectForm"),statusFilter=document.getElementById("statusFilter"),sortFilter=document.getElementById("sortFilter");
    function slug(value){return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
    function parseRows(key){const tb=document.createElement("tbody");try{tb.innerHTML=localStorage.getItem(key)||""}catch(e){}return [...tb.rows]}
    function normalizeRequest(row){if(row.cells[0]?.classList.contains("request-number"))row.deleteCell(0);const statusIndex=[...row.cells].findIndex(c=>c.querySelector(".status"));if(statusIndex===2){const client=row.dataset.website||row.querySelector(".request-website-label")?.textContent.trim()||"—";row.insertCell(1).textContent=client}row.querySelector(".request-website-label")?.remove();if(row.querySelector(".ellipsis"))row.deleteCell(row.cells.length-1);return row}
    function persist(){const payload=projects.map(p=>({...p,id:p.id||slug(p.name)}));localStorage.setItem(PROJECTS_KEY,JSON.stringify(payload));localStorage.setItem(DELETED_KEY,JSON.stringify(deletedNames));const stored=JSON.parse(localStorage.getItem(PROJECTS_KEY)||"[]");if(stored.length!==payload.length||stored.some(p=>!payload.some(q=>q.id===p.id&&q.name===p.name)))throw new Error("Η αποθήκευση δεν επιβεβαιώθηκε από τον browser.")}
    function migrateLegacyArchive(){const archive=parseRows(ARCHIVE_KEY),legacy=parseRows(HISTORY_KEY);const identity=r=>r.dataset.archiveKey||[r.dataset.title||r.querySelector(".request-title")?.textContent.trim(),r.dataset.completedAt||"",r.dataset.website||""].join("::");archive.forEach(r=>{normalizeRequest(r);r.dataset.archiveKey=r.dataset.archiveKey||identity(r)});legacy.forEach(r=>{normalizeRequest(r);r.dataset.archiveKey=r.dataset.archiveKey||identity(r);if(!archive.some(saved=>identity(saved)===identity(r)))archive.push(r)});if(legacy.length){localStorage.setItem(ARCHIVE_KEY,archive.map(r=>r.outerHTML).join(""));localStorage.setItem(HISTORY_KEY,"")}}
    function render(){grid.innerHTML="";const requests=[...parseRows(REQUESTS_KEY),...parseRows(ARCHIVE_KEY)].map(normalizeRequest);let visibleProjects=[...projects];if(sortFilter.value==="name")visibleProjects.sort((a,b)=>a.name.localeCompare(b.name,"el"));else visibleProjects.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));const term=search.value.trim().toLocaleLowerCase("el");let shown=0;visibleProjects.forEach(p=>{const hay=(p.name+" "+(p.client||"")+" "+(p.description||"")).toLocaleLowerCase("el");if(term&&!hay.includes(term))return;if(statusFilter.value&&statusFilter.value!==p.status)return;shown++;const total=requests.filter(r=>(r.dataset.website||r.cells[1]?.textContent.trim())===p.name).length;const card=document.createElement("article");card.className="project-card";card.dataset.status=p.status||"Ενεργός";card.innerHTML='<div class="project-logo"><span>Logo / φωτογραφία</span></div><div class="project-body"><div class="project-heading"><div><h2 class="project-name"></h2><p class="project-client"></p></div><button class="edit-project" type="button" aria-label="Επεξεργασία πελάτη"><i data-lucide="pencil"></i></button></div><p class="project-description"></p><div class="project-status"></div><div class="project-footer"><span class="request-count"></span><a class="open-project" href="#" aria-label="Προβολή αιτημάτων">→</a></div></div>';card.querySelector(".project-name").textContent=p.name;card.querySelector(".project-client").textContent=p.client||"Χωρίς υπεύθυνο";card.querySelector(".project-description").textContent=p.description||"";card.querySelector(".project-status").textContent=p.status||"Ενεργός";card.querySelector(".request-count").textContent=total+" "+(total===1?"αίτημα":"αιτήματα");if(p.logo){const img=document.createElement("img");img.src=p.logo;img.alt="Logo του "+p.name;card.querySelector(".project-logo").replaceChildren(img)}card.querySelector(".open-project").href="requests.html?website="+encodeURIComponent(p.name);card.querySelector(".edit-project").addEventListener("click",()=>openEdit(p));grid.append(card)});count.textContent=shown+" "+(shown===1?"πελάτης":"πελάτες");empty.hidden=shown!==0;if(window.lucide)lucide.createIcons()}
    function showModal(){modal.classList.add("open");document.getElementById("projectName").focus()}
    function openNew(){editingId=null;form.reset();selectedLogo="";document.getElementById("projectModalTitle").textContent="Νέος πελάτης";document.getElementById("saveProject").textContent="Δημιουργία πελάτη";document.getElementById("deleteProjectInModal").hidden=true;document.getElementById("logoPreview").classList.remove("show");document.getElementById("logoPreviewImage").removeAttribute("src");document.getElementById("saveError").hidden=true;showModal()}
    function openEdit(p){editingId=p.id;form.reset();document.getElementById("projectName").value=p.name;document.getElementById("projectContact").value=p.client||"";document.getElementById("projectDescription").value=p.description||"";document.getElementById("projectStatus").value=p.status||"Ενεργός";selectedLogo=p.logo||"";document.getElementById("logoPreview").classList.toggle("show",!!selectedLogo);if(selectedLogo)document.getElementById("logoPreviewImage").src=selectedLogo;else document.getElementById("logoPreviewImage").removeAttribute("src");document.getElementById("projectModalTitle").textContent="Επεξεργασία πελάτη";document.getElementById("saveProject").textContent="Αποθήκευση";document.getElementById("deleteProjectInModal").hidden=false;document.getElementById("saveError").hidden=true;showModal()}
    function closeModal(){modal.classList.remove("open");form.reset();editingId=null;selectedLogo="";document.getElementById("logoPreview").classList.remove("show");document.getElementById("logoPreviewImage").removeAttribute("src")}
    async function imageToDataUrl(file){if(file.size>8*1024*1024)throw new Error("Η εικόνα πρέπει να είναι μικρότερη από 8 MB.");return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("Δεν ήταν δυνατή η ανάγνωση της εικόνας."));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("Δεν ήταν δυνατή η φόρτωση της εικόνας."));img.onload=()=>{const scale=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);let data=c.toDataURL("image/webp",.76);if(data.length>500000)data=c.toDataURL("image/jpeg",.65);if(data.length>700000)return reject(new Error("Το logo παραμένει μεγάλο. Δοκίμασε μικρότερη εικόνα."));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}
    async function renameLinkedRequests(oldName,newName){for(const key of [REQUESTS_KEY,ARCHIVE_KEY,HISTORY_KEY]){const rows=parseRows(key);rows.forEach(r=>{if(r.dataset.website===oldName)r.dataset.website=newName;normalizeRequest(r);if(r.cells[1]&&r.dataset.website===newName)r.cells[1].textContent=newName});localStorage.setItem(key,rows.map(r=>r.outerHTML).join(""))}}
    async function removeProject(p){const aliases=p.name==="Run Jane Run"?[p.name,"Run","Jane","Run!"]:[p.name];const keys=[REQUESTS_KEY,ARCHIVE_KEY,HISTORY_KEY];const linked=keys.flatMap(k=>parseRows(k)).filter(r=>aliases.includes(r.dataset.website));if(!confirm("Να διαγραφεί ο πελάτης «"+p.name+"»;"+(linked.length?" Θα διαγραφούν και τα "+linked.length+" σχετικά αιτήματα.":"")))return false;try{for(const k of keys){const rr=parseRows(k).filter(r=>!aliases.includes(r.dataset.website));localStorage.setItem(k,rr.map(r=>r.outerHTML).join(""))}projects=projects.filter(x=>x.id!==p.id);deletedNames.push(p.name);persist();render();return true}catch(e){alert("Δεν αποθηκεύτηκε η διαγραφή. Έλεγξε τον ελεύθερο χώρο του browser και δοκίμασε ξανά.");return false}}
    document.getElementById("deleteProjectInModal").addEventListener("click",()=>{const project=projects.find(p=>p.id===editingId);if(project&&removeProject(project))closeModal()});
    document.getElementById("addProject").addEventListener("click",openNew);document.getElementById("closeProjectModal").addEventListener("click",closeModal);document.getElementById("cancelProject").addEventListener("click",closeModal);modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
    document.getElementById("projectLogo").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{selectedLogo=await imageToDataUrl(f);document.getElementById("logoPreviewImage").src=selectedLogo;document.getElementById("logoPreview").classList.add("show")}catch(err){selectedLogo="";e.target.value="";alert(err.message)}});document.getElementById("removeLogo").addEventListener("click",()=>{selectedLogo="";document.getElementById("projectLogo").value="";document.getElementById("logoPreview").classList.remove("show")});
    form.addEventListener("submit",async e=>{e.preventDefault();const name=document.getElementById("projectName").value.trim(),old=projects.find(p=>p.id===editingId);if(!name)return;if(projects.some(p=>p.id!==editingId&&p.name.toLocaleLowerCase("el")===name.toLocaleLowerCase("el"))){alert("Υπάρχει ήδη πελάτης με αυτό το όνομα.");return}const next={...(old||{}),id:old?.id||slug(name)+"-"+Date.now().toString(36),name,client:document.getElementById("projectContact").value.trim(),description:document.getElementById("projectDescription").value.trim(),status:document.getElementById("projectStatus").value,logo:selectedLogo,updatedAt:Date.now(),type:"Website"};const previous=old?{...old}:null;try{if(old){const i=projects.indexOf(old);projects[i]=next;if(old.name!==name)await renameLinkedRequests(old.name,name)}else projects.unshift(next);if(old&&old.name!==name&&DEFAULT_PROJECTS.some(d=>d.name===old.name))deletedNames.push(old.name);deletedNames=deletedNames.filter(n=>n!==name);persist();closeModal();render()}catch(err){if(old&&previous){const i=projects.findIndex(p=>p.id===next.id);if(i>=0)projects[i]=previous}else projects=projects.filter(p=>p.id!==next.id);document.getElementById("saveError").textContent="Δεν αποθηκεύτηκε. Ο browser ίσως δεν έχει αρκετό ελεύθερο χώρο· δοκίμασε μικρότερη εικόνα ή αφαίρεσέ την.";document.getElementById("saveError").hidden=false;console.error(err)}});
    document.getElementById("topSearch").addEventListener("input",render);statusFilter.addEventListener("change",render);sortFilter.addEventListener("change",render);migrateLegacyArchive();render();
  </script>
</body>
