<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Όλα τα αιτήματα — Saitari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0b1020;--indigo:#635bff;--bg:#f7f8fc;--line:#e3e8f2;--text:#151c32;--muted:#75809a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
    main{max-width:1200px;margin:auto;padding:55px 25px}a{color:var(--indigo);text-decoration:none;font-weight:700}
    h1{font:700 clamp(2rem,4vw,3rem)/1 "Space Grotesk";letter-spacing:-.06em;margin:25px 0 8px}
    p{color:var(--muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:34px 0 18px}
    input,select{min-height:44px;border:1px solid var(--line);border-radius:9px;background:white;padding:0 13px;color:var(--text)}
    input{flex:1;min-width:220px}.count{font-size:.84rem;color:var(--muted);margin:15px 0}
    .panel{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}
    table{width:100%;min-width:700px;border-collapse:collapse}th,td{text-align:left;padding:18px 20px;border-bottom:1px solid var(--line);font-size:.88rem}
    th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover{background:#fafbff}
    .status{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-size:.8rem;font-weight:700}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
    .status-new{color:#5d55eb;background:#eeedff}.status-progress{color:#2878ed;background:#eaf3ff}.status-review{color:#bc7300;background:#fff5e2}.status-done{color:#009f82;background:#e3fff8}
    .empty{padding:55px 20px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Επιστροφή στο dashboard</a>
    <h1>Όλα τα αιτήματα</h1>
    <p>Αναζήτησε και φιλτράρισε όλα τα αιτήματα του workspace.</p>

    <div class="toolbar">
      <input id="search" placeholder="Αναζήτηση τίτλου ή σελίδας…">
      <select id="statusFilter">
        <option value="">Όλες οι καταστάσεις</option>
        <option>Νέο</option><option>Σε εξέλιξη</option>
        <option>Για έγκριση</option><option>Ολοκληρώθηκε</option>
      </select>
    </div>

    <div class="count" id="count"></div>
    <section class="panel">
      <table>
        <thead><tr><th>#</th><th>Αίτημα</th><th>Σελίδα</th><th>Κατάσταση</th><th>Ημερομηνία</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <div class="empty" id="empty" hidden>Δεν βρέθηκαν αιτήματα με αυτά τα φίλτρα.</div>
    </section>
  </main>

  <script>
    const saved = localStorage.getItem("saitari-requests");
    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");

    if (saved) {
      const temporaryTable = document.createElement("tbody");
      temporaryTable.innerHTML = saved;

      [...temporaryTable.rows].forEach(row => {
        const clone = row.cloneNode(true);
        if (clone.cells.length > 5) clone.deleteCell(5);
        clone.addEventListener("click", () => {
          localStorage.setItem("saitari-selected-request", clone.outerHTML);
          window.location.href = "index.html";
        });
        list.appendChild(clone);
      });
    }

    function filterRequests() {
      const term = search.value.toLowerCase();
      const status = statusFilter.value;
      let visible = 0;

      [...list.rows].forEach(row => {
        const text = row.textContent.toLowerCase();
        const rowStatus = row.querySelector(".status")?.textContent.trim();
        const match = text.includes(term) && (!status || rowStatus === status);
        row.hidden = !match;
        if (match) visible++;
      });

      document.getElementById("count").textContent = `${visible} αιτήματα`;
      document.getElementById("empty").hidden = visible !== 0;
    }

    search.addEventListener("input", filterRequests);
    statusFilter.addEventListener("change", filterRequests);
    filterRequests();
  </script>
</body>
</html>
