<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Αρχείο — Saitari</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/assets/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--ink:#0b1020;--indigo:#635bff;--canvas:#f7f8fc;--border:#e3e8f2;--text:#151c32;--muted:#75809a;--shadow:0 16px 42px rgba(22,31,65,.05)}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:30px 14px 20px;display:flex;flex-direction:column;background:var(--ink);color:#c9d2eb}.brand{display:flex;align-items:center;gap:11px;margin:0 14px 42px;color:white;font:700 1.55rem "Space Grotesk";letter-spacing:-.06em}.brand-mark{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(140deg,#635bff,#887fff);color:white;font-size:.8rem}.nav-label{margin:0 14px 9px;color:#7280a4;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.nav-group{margin-bottom:29px}.nav-item{min-height:45px;display:flex;align-items:center;gap:12px;border-left:3px solid transparent;border-radius:9px;padding:0 14px;color:#bdc8e6;text-decoration:none;font-size:.89rem}.nav-item svg{width:18px}.nav-item:hover{color:white;background:#ffffff0f}.nav-item.active{color:white;border-left-color:var(--indigo)}.sidebar-footer{margin-top:auto;padding:18px 12px 0;border-top:1px solid #ffffff17}.profile{display:flex;align-items:center;gap:10px}.avatar{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#7069ff,#3731a9);color:white;font-size:.69rem;font-weight:700}.profile strong,.profile small{display:block}.profile strong{color:white;font-size:.83rem}.profile small{margin-top:2px;color:#8090b5;font-size:.72rem}.content{min-width:0}.topbar{height:95px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 46px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.72)}.search{width:min(400px,44vw);height:42px;display:flex;align-items:center;gap:11px;padding:0 13px;border:1px solid #dce3ef;border-radius:9px;background:white;color:var(--muted)}.search:focus-within{border-color:#a9a5ff;box-shadow:0 0 0 3px #635bff12}.search svg{width:17px;height:17px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:.88rem}.top-actions{display:flex;align-items:center;gap:22px}.icon-button{width:37px;height:37px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#3c4966}.icon-button:hover{background:#f1f4fa}.icon-button svg{width:20px;height:20px}.account{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600}.account svg{width:16px;color:var(--muted)}main{width:min(100%,1320px);margin:0 auto;padding:56px 46px 70px}h1,h2{margin:0;font-family:"Space Grotesk",sans-serif;letter-spacing:-.045em}h1{font-size:clamp(2rem,3vw,2.55rem);font-weight:700;line-height:1.1}.intro{margin:10px 0 0;color:var(--muted);font-size:.92rem;line-height:1.6}.page-header{margin:0 0 36px}.count{margin:0 0 13px;color:var(--muted);font-size:.82rem}.panel{overflow:auto;border:1px solid var(--border);border-radius:12px;background:white;box-shadow:var(--shadow)}table{width:100%;min-width:760px;border-collapse:collapse}tbody tr{transition:background .15s ease}th,td{text-align:left;padding:16px 18px;border-bottom:1px solid var(--border);font-size:.84rem}th{color:#8995aa;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbff}.request-title{font-weight:650}.status{display:inline-flex;align-items:center;min-height:32px;padding:5px 10px;border:1px solid #dfe5ef;border-left:4px solid currentColor;border-radius:6px;background:#e3fff8;color:#009f82;font-size:.75rem;font-weight:650}.delete-button{width:34px;height:34px;display:grid;place-items:center;border:1px solid #f1caca;border-radius:8px;background:white;color:#b42318;cursor:pointer}.delete-button svg{width:16px}.empty{padding:52px 20px;text-align:center;color:var(--muted)}.empty[hidden]{display:none}.mobile-nav{display:none}
@media(max-width:1020px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding-inline:10px}.brand{justify-content:center;margin-inline:0}.brand>span:last-child,.nav-label,.nav-item span{display:none}.nav-item{justify-content:center;padding:0}.sidebar-footer{padding-inline:0}.profile{justify-content:center}.profile div{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.mobile-nav{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;background:#0b1020;border:1px solid #ffffff18;border-radius:16px;box-shadow:0 12px 35px #0b102044}.mobile-nav a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#bdc8e6;text-decoration:none;font-size:.66rem}.mobile-nav a.active{color:white;border-bottom:2px solid var(--indigo)}.mobile-nav svg{width:19px;height:19px}body{padding-bottom:94px}.topbar{height:72px;padding:0 20px}.search{display:none}main{padding:38px 20px 50px}.account{display:none}}
.brand-mark-image {
  width: 33px;
  height: 33px;
  display: block;
  object-fit: contain;
  border-radius: 9px;
}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><img class="brand-mark-image" src="/assets/saitari-mark.png" alt=""><span>Saitari</span></div><div class="nav-group"><p class="nav-label">Workspace</p><a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a><a class="nav-item" href="websites.html"><i data-lucide="users-round"></i><span>Πελάτες</span></a><a class="nav-item" href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a><a class="nav-item active" href="archive.html" aria-current="page"><i data-lucide="archive"></i><span>Αρχείο</span></a></div><div class="sidebar-footer"><div class="profile"><span class="avatar">NT</span><div><strong>Tasos</strong><small>Designer</small></div></div></div></aside>
<nav class="mobile-nav" aria-label="Κύρια πλοήγηση"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a><a href="websites.html"><i data-lucide="users-round"></i><span>Πελάτες</span></a><a href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a><a class="active" href="archive.html" aria-current="page"><i data-lucide="archive"></i><span>Αρχείο</span></a></nav>
<div class="content"><header class="topbar"><label class="search"><i data-lucide="search"></i><input id="archiveSearch" type="search" placeholder="Αναζήτηση αιτημάτων..." aria-label="Αναζήτηση αιτημάτων"></label><div class="top-actions"><button class="icon-button" aria-label="Ειδοποιήσεις"><i data-lucide="bell"></i></button><div class="account">Tasos <i data-lucide="chevron-down"></i></div></div></header><main><section class="page-header"><h1>Αρχείο</h1><p class="intro">Τα ολοκληρωμένα αιτήματα παραμένουν εδώ μέχρι να τα διαγράψεις.</p></section><p class="count" id="count"></p><section class="panel"><table><thead><tr><th>Αίτημα</th><th>Πελάτης</th><th>Σελίδα</th><th>Κατάσταση</th><th>Υποβλήθηκε</th><th>Ολοκληρώθηκε</th><th></th></tr></thead><tbody id="archiveRows"></tbody></table><div id="empty" class="empty" hidden>Δεν υπάρχουν ολοκληρωμένα αιτήματα στο αρχείο.</div></section></main></div></div>
<script>
if(window.lucide)lucide.createIcons();
const ACTIVE_KEY="saitari-requests",ARCHIVE_KEY="saitari-archived-requests",LEGACY_HISTORY_KEY="saitari-archive-history";
function readRows(key){const tb=document.createElement("tbody");tb.innerHTML=localStorage.getItem(key)||"";return [...tb.rows]}
function normalize(row){if(row.cells[0]?.classList.contains("request-number"))row.deleteCell(0);const statusIndex=[...row.cells].findIndex(c=>c.querySelector(".status"));if(statusIndex===2)row.insertCell(1).textContent=row.dataset.website||row.querySelector(".request-website-label")?.textContent.trim()||"—";row.querySelector(".request-website-label")?.remove();if(row.querySelector(".ellipsis"))row.deleteCell(row.cells.length-1);row.dataset.title=row.dataset.title||row.querySelector(".request-title")?.textContent.trim()||"";return row}
function archiveKey(row){return row.dataset.archiveKey||[row.dataset.title,row.dataset.completedAt||"",row.dataset.website||""].join("::")}
function loadArchived(){const now=Date.now(),active=readRows(ACTIVE_KEY),archive=readRows(ARCHIVE_KEY),legacy=readRows(LEGACY_HISTORY_KEY);active.forEach(normalize);archive.forEach(row=>{normalize(row);row.dataset.archiveKey=row.dataset.archiveKey||archiveKey(row)});legacy.forEach(row=>{normalize(row);row.dataset.archiveKey=row.dataset.archiveKey||archiveKey(row);if(!archive.some(saved=>archiveKey(saved)===archiveKey(row)))archive.push(row)});active.forEach(row=>{if(row.querySelector(".status")?.textContent.trim()!=="Ολοκληρώθηκε")return;row.dataset.completedAt=row.dataset.completedAt||new Date(now).toISOString();row.dataset.archivedAt=row.dataset.archivedAt||new Date(now).toISOString();row.dataset.archiveKey=row.dataset.archiveKey||crypto.randomUUID();row.hidden=false;archive.push(row)});localStorage.setItem(ACTIVE_KEY,active.filter(row=>row.querySelector(".status")?.textContent.trim()!=="Ολοκληρώθηκε").map(row=>row.outerHTML).join(""));localStorage.setItem(ARCHIVE_KEY,archive.map(row=>row.outerHTML).join(""));localStorage.setItem(LEGACY_HISTORY_KEY,"");return archive}
const body=document.getElementById("archiveRows"),search=document.getElementById("archiveSearch");let saved=[];
function render(){body.innerHTML="";const term=search.value.trim().toLocaleLowerCase("el");let shown=0;saved.forEach(row=>{const title=row.dataset.title||"Αίτημα",client=row.dataset.website||row.cells[1]?.textContent.trim()||"—",area=row.dataset.area||row.cells[2]?.textContent.trim()||"—",status=row.querySelector(".status")?.textContent.trim()||"Ολοκληρώθηκε",submitted=row.cells[4]?.textContent.trim()||row.cells[3]?.textContent.trim()||"—",completed=row.dataset.completedAt?new Date(row.dataset.completedAt).toLocaleDateString("el-GR"):"—";if(![title,client,area,status,submitted,completed].join(" ").toLocaleLowerCase("el").includes(term))return;shown++;const tr=document.createElement("tr");tr.dataset.archiveKey=row.dataset.archiveKey;[title,client,area,status,submitted,completed].forEach((value,i)=>{const td=tr.insertCell();td.textContent=value;if(i===0)td.className="request-title";if(i===3){const badge=document.createElement("span");badge.className="status";badge.textContent=value;td.replaceChildren(badge)}});const action=tr.insertCell();action.innerHTML='<button class="delete-button" type="button" aria-label="Διαγραφή από το αρχείο"><i data-lucide="trash-2"></i></button>';action.querySelector("button").addEventListener("click",()=>{if(!confirm("Να διαγραφεί οριστικά το «"+title+"» από το αρχείο;"))return;saved=saved.filter(item=>item.dataset.archiveKey!==row.dataset.archiveKey);localStorage.setItem(ARCHIVE_KEY,saved.map(item=>item.outerHTML).join(""));render()});body.append(tr)});document.getElementById("count").textContent=shown+" "+(shown===1?"ολοκληρωμένο αίτημα":"ολοκληρωμένα αιτήματα");document.getElementById("empty").hidden=shown!==0;if(window.lucide)lucide.createIcons()}
saved=loadArchived();search.addEventListener("input",render);render();
</script></body></html>
