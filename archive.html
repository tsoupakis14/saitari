<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Αρχείο — Saitari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--ink:#0b1020;--indigo:#635bff;--canvas:#f7f8fc;--border:#e3e8f2;--text:#151c32;--muted:#75809a;--shadow:0 16px 42px rgba(22,31,65,.06)}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:30px 14px 20px;display:flex;flex-direction:column;background:var(--ink);color:#c9d2eb}.brand{display:flex;align-items:center;gap:11px;margin:0 14px 42px;color:#fff;font:700 1.55rem "Space Grotesk";letter-spacing:-.06em}.brand-mark{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(140deg,#635bff,#887fff);color:#fff;font-size:.8rem}.nav-label{margin:0 14px 9px;color:#7280a4;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.nav-group{margin-bottom:29px}.nav-item{min-height:45px;display:flex;align-items:center;gap:12px;border-left:3px solid transparent;border-radius:9px;padding:0 14px;color:#bdc8e6;text-decoration:none;font-size:.89rem}.nav-item svg{width:18px}.nav-item.active{color:white;border-left-color:var(--indigo)}.sidebar-footer{margin-top:auto;padding:18px 12px 0;border-top:1px solid #ffffff17;color:#fff;font-size:.84rem}.content{min-width:0}.topbar{height:95px;display:flex;align-items:center;justify-content:flex-end;padding:0 46px;border-bottom:1px solid var(--border);background:#ffffffba}.account{font-size:.88rem;font-weight:600}main{max-width:1320px;margin:auto;padding:56px 46px 70px}.page-header{margin-bottom:30px}h1,h2{margin:0;font-family:"Space Grotesk",sans-serif;letter-spacing:-.05em}h1{font-size:clamp(2rem,4vw,3rem)}.intro{margin:10px 0 0;color:var(--muted);line-height:1.6}.count{margin:0 0 14px;color:var(--muted);font-size:.84rem}.panel{overflow:auto;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}table{width:100%;min-width:700px;border-collapse:collapse}th,td{text-align:left;padding:17px 19px;border-bottom:1px solid var(--border);font-size:.87rem}th{color:var(--muted);font-size:.69rem;text-transform:uppercase;letter-spacing:.08em}tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;min-height:34px;padding:6px 12px;border:1px solid currentColor;border-left-width:4px;border-radius:7px;background:#e3fff8;color:#009f82;font-size:.78rem;font-weight:650}.delete-button{width:34px;height:34px;display:grid;place-items:center;border:1px solid #f1caca;border-radius:8px;background:white;color:#b42318;cursor:pointer}.delete-button svg{width:16px}.empty{padding:52px 20px;text-align:center;color:var(--muted)}.empty[hidden]{display:none}.mobile-nav{display:none}
@media(max-width:1020px){.app{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding-inline:10px}.brand{justify-content:center;margin-inline:0}.brand>span:last-child,.nav-label,.nav-item span{display:none}.nav-item{justify-content:center;padding:0}.sidebar-footer{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.mobile-nav{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;background:#0b1020;border:1px solid #ffffff18;border-radius:16px;box-shadow:0 12px 35px #0b102044}.mobile-nav a{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#bdc8e6;text-decoration:none;font-size:.68rem}.mobile-nav a.active{color:#fff;border-bottom:2px solid var(--indigo)}.mobile-nav svg{width:19px}body{padding-bottom:94px}.topbar{height:72px;padding:0 20px}main{padding:38px 20px 50px}}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><span>Saitari</span></div><div class="nav-group"><p class="nav-label">Workspace</p><a class="nav-item" href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a><a class="nav-item" href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a><a class="nav-item" href="websites.html"><i data-lucide="monitor"></i><span>Πελάτες</span></a><a class="nav-item active" href="archive.html" aria-current="page"><i data-lucide="archive"></i><span>Αρχεία</span></a></div><div class="sidebar-footer">Tasos · Designer</div></aside>
<nav class="mobile-nav" aria-label="Κύρια πλοήγηση"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a><a href="requests.html"><i data-lucide="file-text"></i><span>Αιτήματα</span></a><a href="websites.html"><i data-lucide="monitor"></i><span>Πελάτες</span></a><a class="active" href="archive.html" aria-current="page"><i data-lucide="archive"></i><span>Αρχεία</span></a></nav>
<div class="content"><header class="topbar"><div class="account">Tasos <i data-lucide="chevron-down"></i></div></header><main><section class="page-header"><h1>Αρχείο</h1><p class="intro">Τα ολοκληρωμένα αιτήματα μεταφέρονται εδώ 3 ημέρες μετά την ολοκλήρωσή τους.</p></section><p class="count" id="count"></p><section class="panel"><table><thead><tr><th>Αίτημα</th><th>Σελίδα</th><th>Κατάσταση</th><th>Website</th><th>Αρχειοθετήθηκε</th><th></th></tr></thead><tbody id="archiveRows"></tbody></table><div id="empty" class="empty" hidden>Δεν υπάρχουν αρχειοθετημένα αιτήματα ακόμη.</div></section></main></div></div>
<script>
lucide.createIcons();
const ACTIVE_KEY="saitari-requests", ARCHIVE_KEY="saitari-archived-requests", RETENTION=3*24*60*60*1000;
const active=document.createElement("tbody"); active.innerHTML=localStorage.getItem(ACTIVE_KEY)||"";
const archived=document.createElement("tbody"); archived.innerHTML=localStorage.getItem(ARCHIVE_KEY)||"";
const now=Date.now();
[...active.rows].forEach(row=>{if(row.querySelector(".status")?.textContent.trim()!=="Ολοκληρώθηκε")return;let time=Date.parse(row.dataset.completedAt||"");if(!Number.isFinite(time)){time=now;row.dataset.completedAt=new Date(time).toISOString()}if(now-time>=RETENTION){row.dataset.archivedAt=new Date(now).toISOString();row.dataset.archiveKey=row.dataset.archiveKey||row.dataset.title||row.cells[0]?.textContent.trim()||crypto.randomUUID();row.hidden=false;archived.appendChild(row)}});
localStorage.setItem(ACTIVE_KEY,active.innerHTML);localStorage.setItem(ARCHIVE_KEY,archived.innerHTML);
const body=document.getElementById("archiveRows");
[...archived.rows].reverse().forEach(row=>{const copy=row.cloneNode(true), cells=copy.cells;if(cells[0]?.classList.contains("request-number"))copy.deleteCell(0);if(copy.querySelector(".ellipsis"))copy.deleteCell(copy.cells.length-1);while(copy.cells.length>4)copy.deleteCell(copy.cells.length-1);const website=copy.dataset.website||"—";if(copy.cells[3])copy.cells[3].textContent=website;const archivedAt=copy.dataset.archivedAt?new Date(copy.dataset.archivedAt).toLocaleDateString("el-GR"):"—";const dateCell=copy.insertCell(-1);dateCell.textContent=archivedAt;const action=copy.insertCell(-1);action.innerHTML='<button class="delete-button" type="button" aria-label="Διαγραφή από το αρχείο"><i data-lucide="trash-2"></i></button>';action.querySelector("button").addEventListener("click",()=>{const title=copy.dataset.title||copy.querySelector(".request-title")?.textContent.trim()||"το αίτημα";if(!confirm("Να διαγραφεί οριστικά από το αρχείο το «"+title+"»;"))return;const updated=document.createElement("tbody");updated.innerHTML=localStorage.getItem(ARCHIVE_KEY)||"";const found=[...updated.rows].find(r=>r.dataset.archiveKey===copy.dataset.archiveKey);if(found)found.remove();localStorage.setItem(ARCHIVE_KEY,updated.innerHTML);copy.remove();updateCount()});body.appendChild(copy)});
function updateCount(){const n=body.rows.length;document.getElementById("count").textContent=n+" "+(n===1?"αρχειοθετημένο αίτημα":"αρχειοθετημένα αιτήματα");document.getElementById("empty").hidden=n!==0}
updateCount();lucide.createIcons();
</script></body></html>
